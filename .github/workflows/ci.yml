name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint und Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Systembibliotheken fuer OCP und OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl1 libglu1-mesa libxrender1 libxext6 libsm6 libgomp1

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
        env:
          MPLBACKEND: Agg

  frontend:
    name: Frontend (Lint, Tests und Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

  schema:
    name: Gemeinsames JSON-Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Schema ist gueltiges JSON
        run: python -c "import json,pathlib; json.loads(pathlib.Path('shared/schemas/vcutting-project-1.0.schema.json').read_text())"

  docker:
    name: Docker-Images bauen
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Compose baut beide Images. Das prueft in einem Schritt die
      # Dockerfiles und die Zusammenstellung.
      - name: Images bauen
        run: docker compose build

      - name: Compose startet und antwortet
        run: |
          docker compose up -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/api/health > /dev/null; then
              echo "Backend ist erreichbar."
              curl --silent http://localhost:8000/api/health
              exit 0
            fi
            sleep 5
          done
          echo "Backend hat nicht geantwortet."
          docker compose logs
          exit 1

      - name: Aufraeumen
        if: always()
        run: docker compose down --volumes
