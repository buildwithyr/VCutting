services:
  backend:
    build:
      context: ./backend
    environment:
      # Das Frontend spricht das Backend ueber den nginx-Proxy an, deshalb
      # reicht der lokale Ursprung fuer direkte Zugriffe waehrend der Arbeit.
      VCUTTING_CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
      VCUTTING_DATA_DIR: /data
      VCUTTING_JOB_RETENTION_SECONDS: "86400"
    volumes:
      - job-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  # Jobdaten sind fluechtig. Das Volume verhindert nur, dass sie bei einem
  # Neustart des Containers sofort verschwinden.
  job-data:
